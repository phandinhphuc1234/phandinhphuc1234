<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="320" viewBox="0 0 1080 320" role="img" aria-labelledby="title description">
  <title id="title">Backend Playground — Follow the request</title>
  <desc id="description">Request dots travel from an API to a queue, a worker, and a data store. An original conceptual illustration, not a live system monitor.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#97b8c7" opacity=".09"/></pattern>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101e2a"/><stop offset="1" stop-color="#142b35"/></linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style>
  <rect width="1080" height="320" rx="18" fill="url(#background)"/>
  <rect width="1080" height="320" rx="18" fill="url(#grid)"/>
  <rect x="32" y="32" width="4" height="60" rx="2" fill="#74dfc4"/>
  <text x="52" y="48" class="mono" font-size="12" letter-spacing="2" fill="#83b7ba">PDP / SYSTEM SKETCH 001</text>
  <text x="50" y="83" font-size="30" font-weight="600" fill="#ecf5f4">Follow the request.</text>
  <rect x="853" y="37" width="191" height="30" rx="15" fill="#203b40" stroke="#36585a"/>
  <circle cx="871" cy="52" r="4" fill="#74dfc4"/>
  <text x="884" y="57" class="mono" font-size="11" fill="#b6d2cf">A BACKEND PLAYGROUND</text>
  <path d="M48 193H1032" fill="none" stroke="#3c656b" stroke-width="2"/>
  <path d="m302 189 5 4-5 4m234-8 5 4-5 4m234-8 5 4-5 4" fill="none" stroke="#74dfc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="motion">
    <circle r="4" fill="#74dfc4"><animateMotion path="M48 193H1032" dur="8s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#f5b17f"><animateMotion path="M48 193H1032" dur="8s" begin="-2.6s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#74dfc4"><animateMotion path="M48 193H1032" dur="8s" begin="-5.3s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#192e3b" stroke="#375460">
    <rect x="90" y="138" width="188" height="110" rx="13"/>
    <rect x="328" y="138" width="188" height="110" rx="13"/>
    <rect x="566" y="138" width="188" height="110" rx="13"/>
    <rect x="804" y="138" width="188" height="110" rx="13"/>
  </g>
  <g class="mono" fill="#81a7ad" font-size="11" letter-spacing="1.5">
    <text x="90" y="122">01 / RECEIVE</text><text x="328" y="122">02 / BUFFER</text>
    <text x="566" y="122">03 / PROCESS</text><text x="804" y="122">04 / PERSIST</text>
  </g>
  <g fill="none" stroke="#74dfc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m122 159-8 8 8 8m12-16 8 8-8 8m-6-17-3 19"/>
    <rect x="350" y="158" width="27" height="7" rx="2"/><rect x="350" y="170" width="27" height="7" rx="2"/>
    <path d="m600 157-10 15h10l-2 9 12-16h-10l2-8" stroke="#f5b17f"/>
    <ellipse cx="840" cy="161" rx="13" ry="5"/><path d="M827 161v15c0 7 26 7 26 0v-15m-26 8c0 7 26 7 26 0"/>
  </g>
  <g fill="#ecf5f4" font-size="23" font-weight="600">
    <text x="112" y="208">API</text><text x="350" y="208">Queue</text><text x="588" y="208">Worker</text><text x="826" y="208">Store</text>
  </g>
  <g fill="#a4bbc3" font-size="13">
    <text x="112" y="230">Give it a way in.</text><text x="350" y="230">Give it a little room.</text>
    <text x="588" y="230">Do the useful work.</text><text x="826" y="230">Keep what matters.</text>
  </g>
  <circle cx="48" cy="193" r="5" fill="#74dfc4"/><circle cx="1032" cy="193" r="5" fill="#f5b17f"/>
  <text x="36" y="290" font-size="13" fill="#9fb7bd">Small requests. Interesting problems.</text>
  <text x="1044" y="290" text-anchor="end" class="mono" font-size="11" fill="#83b7ba">CONCURRENCY / CONSISTENCY / CURIOSITY</text>
</svg>
