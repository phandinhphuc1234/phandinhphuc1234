<svg xmlns="http://www.w3.org/2000/svg" width="440" height="582" viewBox="0 0 440 582" role="img" aria-labelledby="title description">
  <title id="title">Backend Playground — Follow the request</title>
  <desc id="description">A vertical request journey through an API, a queue, a worker, and a data store. An original conceptual illustration, not a live system monitor.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#97b8c7" opacity=".09"/></pattern>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101e2a"/><stop offset="1" stop-color="#142b35"/></linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style>
  <rect width="440" height="582" rx="18" fill="url(#background)"/>
  <rect width="440" height="582" rx="18" fill="url(#grid)"/>
  <rect x="26" y="28" width="4" height="58" rx="2" fill="#74dfc4"/>
  <text x="44" y="42" class="mono" font-size="12" letter-spacing="1.5" fill="#83b7ba">PDP / SYSTEM SKETCH 001</text>
  <text x="42" y="77" font-size="28" font-weight="600" fill="#ecf5f4">Follow the request.</text>
  <path d="M66 112V514" fill="none" stroke="#3c656b" stroke-width="2"/>
  <g class="motion">
    <circle r="5" fill="#74dfc4"><animateMotion path="M66 112V514" dur="8s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#f5b17f"><animateMotion path="M66 112V514" dur="8s" begin="-2.6s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#74dfc4"><animateMotion path="M66 112V514" dur="8s" begin="-5.3s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#3c656b" stroke-width="2"><path d="M66 160H102M66 260H102M66 360H102M66 460H102"/></g>
  <g fill="#192e3b" stroke="#375460">
    <rect x="102" y="120" width="310" height="80" rx="12"/><rect x="102" y="220" width="310" height="80" rx="12"/>
    <rect x="102" y="320" width="310" height="80" rx="12"/><rect x="102" y="420" width="310" height="80" rx="12"/>
  </g>
  <g fill="#74dfc4"><circle cx="66" cy="160" r="4"/><circle cx="66" cy="260" r="4"/><circle cx="66" cy="460" r="4"/></g>
  <circle cx="66" cy="360" r="4" fill="#f5b17f"/>
  <g class="mono" fill="#81a7ad" font-size="14"><text x="26" y="165">01</text><text x="26" y="265">02</text><text x="26" y="365">03</text><text x="26" y="465">04</text></g>
  <g fill="#ecf5f4" font-size="23" font-weight="600"><text x="122" y="153">API</text><text x="122" y="253">Queue</text><text x="122" y="353">Worker</text><text x="122" y="453">Store</text></g>
  <g fill="#a4bbc3" font-size="16"><text x="122" y="181">Give it a way in.</text><text x="122" y="281">Give it a little room.</text><text x="122" y="381">Do the useful work.</text><text x="122" y="481">Keep what matters.</text></g>
  <text x="28" y="550" font-size="16" fill="#9fb7bd">Small requests. Interesting problems.</text>
</svg>
