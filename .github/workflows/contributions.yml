name: Refresh Pac-Man contribution graph

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/contributions.yml']

permissions:
  contents: write

concurrency:
  group: profile-contribution-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate graphs from public GitHub contributions
        run: |
          npx --yes --package pacman-contribution-graph@5.3.1 pacman-contribution-graph --game pacman --username phandinhphuc1234 --platform github --gameTheme github --output assets/pacman-contribution-graph.svg
          npx --yes --package pacman-contribution-graph@5.3.1 pacman-contribution-graph --game pacman --username phandinhphuc1234 --platform github --gameTheme github-dark --output assets/pacman-contribution-graph-dark.svg
      - name: Save updated graphs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pacman-contribution-graph.svg assets/pacman-contribution-graph-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution graph'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
